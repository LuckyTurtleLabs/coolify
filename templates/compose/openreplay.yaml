    image: public.ecr.aws/p1t3u8a3/sourcemapreader:v1.28.0
    networks:
      default:
        aliases:
          - sourcemapreader-openreplay.app.svc.cluster.local
    environment:
      SMR_HOST: 0.0.0.0
      S3_HOST: http://minio.db.svc.cluster.local:9000
      S3_KEY: ${SERVICE_USER_S3:?}
      S3_SECRET: ${SERVICE_PASSWORD_S3:?}
      AWS_REGION: us-east-1
      LICENSE_KEY: ''
      ASSETS_ORIGIN: ${SERVICE_URL_OPENREPLAY}/sessions-assets

  spot-openreplay:
    <<: *openreplay-service
    image: public.ecr.aws/p1t3u8a3/spot:v1.28.0
    networks:
      default:
        aliases:
          - spot-openreplay.app.svc.cluster.local
    environment:
      CACHE_ASSETS: 'true'
      FS_CLEAN_HRS: '24'
      TOKEN_SECRET: ${SERVICE_PASSWORD_64_TOKEN:?}
      AWS_ACCESS_KEY_ID: ${SERVICE_USER_S3:?}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_S3:?}
      BUCKET_NAME: spots
      AWS_REGION: us-east-1
      AWS_ENDPOINT: ${SERVICE_URL_OPENREPLAY}
      LICENSE_KEY: ''
      KAFKA_SERVERS: kafka.db.svc.cluster.local:9092
      KAFKA_USE_SSL: 'false'
      JWT_SECRET: ${SERVICE_PASSWORD_64_JWT:?}
      JWT_SPOT_SECRET: ${SERVICE_PASSWORD_64_JWTSPOT:?}
      pg_password: ${SERVICE_PASSWORD_POSTGRES:?}
      POSTGRES_STRING: postgres://postgres:${SERVICE_PASSWORD_POSTGRES:?}@postgresql.db.svc.cluster.local:5432/postgres?sslmode=disable
      REDIS_STRING: redis://redis-master.db.svc.cluster.local:6379

