    environment:
      LICENSE_KEY: ''
      KAFKA_SERVERS: kafka.db.svc.cluster.local:9092
      KAFKA_USE_SSL: 'false'
      pg_password: ${SERVICE_PASSWORD_POSTGRES:?}
      POSTGRES_STRING: postgres://postgres:${SERVICE_PASSWORD_POSTGRES:?}@postgresql.db.svc.cluster.local:5432/postgres?sslmode=disable
      REDIS_STRING: redis://redis-master.db.svc.cluster.local:6379

  frontend-openreplay:
    <<: *openreplay-service
    image: public.ecr.aws/p1t3u8a3/frontend:v1.28.0
    networks:
      default:
        aliases:
          - frontend-openreplay.app.svc.cluster.local
    environment:
      TRACKER_HOST: ${SERVICE_URL_OPENREPLAY}/script
      HTTP_PORT: '80'

  http-openreplay:
    <<: *openreplay-service
    image: public.ecr.aws/p1t3u8a3/http:v1.28.0
    networks:
      default:
        aliases:
          - http-openreplay.app.svc.cluster.local
    environment:
