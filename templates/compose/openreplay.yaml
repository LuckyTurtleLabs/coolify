      pg_port: '5432'
      pg_dbname: postgres
      pg_user: postgres
      pg_password: ${SERVICE_PASSWORD_POSTGRES:?}
      SITE_URL: ${SERVICE_URL_OPENREPLAY}
      S3_HOST: ${SERVICE_URL_OPENREPLAY}
      S3_KEY: ${SERVICE_USER_S3:?}
      S3_SECRET: ${SERVICE_PASSWORD_S3:?}
      AWS_DEFAULT_REGION: us-east-1
      sessions_region: us-east-1
      ASSIST_RECORDS_BUCKET: records
      sessions_bucket: mobs
      IOS_VIDEO_BUCKET: mobs
      sourcemaps_bucket: sourcemaps
      js_cache_bucket: sessions-assets
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      EMAIL_SSL_KEY: ''
      EMAIL_SSL_CERT: ''
      EMAIL_FROM: ${EMAIL_FROM:-OpenReplay<do-not-reply@openreplay.com>}
      SCIM_ACCESS_SECRET_KEY: ${SERVICE_PASSWORD_64_SCIMACCESS:?}
      SCIM_REFRESH_SECRET_KEY: ${SERVICE_PASSWORD_64_SCIMREFRESH:?}
      CH_COMPRESSION: 'false'
      CLUSTER_URL: svc.cluster.local
      JWT_EXPIRATION: '86400'
      LOGLEVEL: INFO
      PYTHONUNBUFFERED: '0'
      SAML2_MD_URL: ''
      SCIM_ACCESS_TOKEN_EXPIRE_SECONDS: '86400'
      announcement_url: ''
      assist_secret: ''
      async_Token: ''
      captcha_key: ''
      captcha_server: ''
      iceServers: ''
      idp_entityId: ''
      idp_name: ''
      idp_sls_url: ''
      idp_sso_url: ''
      idp_tenantKey: ''
      idp_x509cert: ''
