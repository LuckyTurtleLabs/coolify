# ignore: true
# documentation: https://docs.openreplay.com/en/deployment/deploy-docker/
# slogan: Session replay and product analytics for web and mobile applications.
# category: analytics
# tags: openreplay,session,replay,analytics
# logo: svgs/openreplay.svg
# port: 80
#
# Disabled pending deployment verification and companion Coolify service docs.
# Before deploying: configure an HTTPS domain and authenticate to public.ecr.aws
# on the destination server (or pre-pull the official images sequentially).
# Keep generated credentials stable. This template initializes NEW databases;
# upgrades require the upstream upgrade procedure, not fresh-install migrations.
# All setup files are downloaded from the same immutable upstream revision.
# No upstream installer, Caddy instance, host ports, or external bind files are needed.
# Upstream revision: 834d0e5cf307e56f108422cba5ddec188a106879

x-openreplay-service: &openreplay-service
  restart: unless-stopped
  volumes:
    - shared-volume:/mnt/efs
  depends_on:
    db-migration:
      condition: service_completed_successfully
    clickhouse-migration:
      condition: service_completed_successfully
    minio-migration:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  setup:
    image: alpine:3.22.2
    exclude_from_hc: true
    restart: 'no'
    volumes:
      - setup-data:/setup
      - shared-volume:/mnt/efs
      - pgdata:/mnt/postgres
      - miniodata:/mnt/minio
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mkdir -p /setup/nginx
        wget -q -O /setup/init_pg_schema.sql https://raw.githubusercontent.com/openreplay/openreplay/834d0e5cf307e56f108422cba5ddec188a106879/scripts/docker-compose/migration-files/init_pg_schema.sql
        wget -q -O /setup/init_ch_schema.sql https://raw.githubusercontent.com/openreplay/openreplay/834d0e5cf307e56f108422cba5ddec188a106879/scripts/docker-compose/migration-files/init_ch_schema.sql
        wget -q -O /setup/nginx/default.conf https://raw.githubusercontent.com/openreplay/openreplay/834d0e5cf307e56f108422cba5ddec188a106879/scripts/docker-compose/nginx.conf
        cd /setup
        sha256sum -c <<'CHECKSUMS'
        c28d09b4b36e5b5fcd2a8f8d08212a3f1d6c05cfb90c9140705555b0820aee28  init_pg_schema.sql
        95ee780ef43b1cf8750821845bece274c5647a792993d1c560d2f87bae907f04  init_ch_schema.sql
        abf86e85751e5402de28820a3d15518354a1a2885c55fd5dbbf951bac9575cdf  nginx/default.conf
        CHECKSUMS
        chmod -R a+rX /setup
        chown -R 1001:1001 /mnt/efs /mnt/postgres
        chown -R 10001:10001 /mnt/minio
  postgresql:
    image: ghcr.io/openreplay/postgres:17
    volumes:
      - pgdata:/bitnami/postgresql
    environment:
      POSTGRESQL_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:?}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      default:
        aliases:
          - postgresql.db.svc.cluster.local
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
  clickhouse:
    image: clickhouse/clickhouse-server:26.2-alpine
    volumes:
      - clickhouse:/var/lib/clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ''
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --query 'SELECT 1'
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      default:
        aliases:
          - clickhouse-openreplay-clickhouse.db.svc.cluster.local
    restart: unless-stopped
  redis:
    image: ghcr.io/openreplay/valkey:8
    volumes:
      - redisdata:/data
    environment:
      ALLOW_EMPTY_PASSWORD: 'yes'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      default:
        aliases:
          - redis-master.db.svc.cluster.local
    restart: unless-stopped
  minio:
    image: docker.io/rustfs/rustfs:1.0.0-beta.1
    volumes:
      - miniodata:/data
    environment:
      RUSTFS_ACCESS_KEY: ${SERVICE_USER_S3:?}
      RUSTFS_SECRET_KEY: ${SERVICE_PASSWORD_S3:?}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_VOLUMES: /data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -so /dev/null http://localhost:9000/ || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      default:
        aliases:
          - minio.db.svc.cluster.local
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
  minio-migration:
    image: ghcr.io/openreplay/minio:2025
    exclude_from_hc: true
    restart: 'no'
    user: root
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_HOST: http://minio:9000
      MINIO_ACCESS_KEY: ${SERVICE_USER_S3:?}
      MINIO_SECRET_KEY: ${SERVICE_PASSWORD_S3:?}
    entrypoint:
      - /bin/bash
      - -ec
      - |
        mc alias set minio "$$MINIO_HOST" "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"
        for bucket in mobs sessions-assets static sourcemaps sessions-mobile-assets quickwit vault-data records spots uxtesting-records; do
          mc mb --ignore-existing "minio/$$bucket"
        done
        mc anonymous set download minio/sessions-assets
  db-migration:
    image: ghcr.io/openreplay/postgres:17
    exclude_from_hc: true
    restart: 'no'
    depends_on:
      postgresql:
        condition: service_healthy
      minio-migration:
        condition: service_completed_successfully
    volumes:
      - setup-data:/setup:ro
    environment:
      PGHOST: postgresql
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: ${SERVICE_PASSWORD_POSTGRES:?}
    entrypoint:
      - /bin/bash
      - -ec
      - psql -v ON_ERROR_STOP=1 -f /setup/init_pg_schema.sql
  clickhouse-migration:
    image: clickhouse/clickhouse-server:26.2-alpine
    exclude_from_hc: true
    restart: 'no'
    depends_on:
      clickhouse:
        condition: service_healthy
      minio-migration:
        condition: service_completed_successfully
    volumes:
      - setup-data:/setup:ro
    entrypoint:
      - /bin/sh
      - -ec
      - clickhouse-client --host clickhouse --user default --port 9000 --multiquery < /setup/init_ch_schema.sql
  openreplay:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    environment:
      - SERVICE_URL_OPENREPLAY
    expose:
      - '80'
    volumes:
      - setup-data:/etc/nginx/openreplay:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        cp /etc/nginx/openreplay/nginx/default.conf /etc/nginx/conf.d/default.conf
        exec nginx -g "daemon off;"
    depends_on:
      frontend-openreplay:
        condition: service_started
      api-openreplay:
        condition: service_started
      chalice-openreplay:
        condition: service_started
      http-openreplay:
        condition: service_started
      images-openreplay:
        condition: service_started
      canvases-openreplay:
        condition: service_started
      assist-openreplay:
        condition: service_started
      spot-openreplay:
        condition: service_started

  alerts-openreplay:
    <<: *openreplay-service
    image: public.ecr.aws/p1t3u8a3/alerts:v1.28.0
    networks:
      default:
        aliases:
          - alerts-openreplay.app.svc.cluster.local
    environment:
      version_number: v1.28.0
      pg_host: postgresql.db.svc.cluster.local
      pg_port: '5432'
      pg_dbname: postgres
      ch_host: clickhouse-openreplay-clickhouse.db.svc.cluster.local
      ch_port: '9000'
      ch_port_http: '8123'
      ch_username: default
      ch_password: ''
      pg_user: postgres
      pg_password: ${SERVICE_PASSWORD_POSTGRES:?}
      SITE_URL: ${SERVICE_URL_OPENREPLAY}
      S3_HOST: ${SERVICE_URL_OPENREPLAY}
      S3_KEY: ${SERVICE_USER_S3:?}
      S3_SECRET: ${SERVICE_PASSWORD_S3:?}
      AWS_DEFAULT_REGION: us-east-1
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      EMAIL_SSL_KEY: ''
      EMAIL_SSL_CERT: ''
      EMAIL_FROM: ${EMAIL_FROM:-OpenReplay<do-not-reply@openreplay.com>}
      LOGLEVEL: INFO
      PYTHONUNBUFFERED: '0'

  api-openreplay:
    <<: *openreplay-service
    image: public.ecr.aws/p1t3u8a3/api:v1.28.0
    networks:
      default:
        aliases:
          - api-openreplay.app.svc.cluster.local
    environment:
      TOKEN_SECRET: ${SERVICE_PASSWORD_64_TOKEN:?}
      ch_db: default
      KAFKA_SERVERS: kafka.db.svc.cluster.local:9092
      KAFKA_USE_SSL: 'false'
      JWT_SECRET: ${SERVICE_PASSWORD_64_JWT:?}
      ASSIST_JWT_SECRET: ${SERVICE_PASSWORD_64_ASSISTJWT:?}
      AWS_ACCESS_KEY_ID: ${SERVICE_USER_S3:?}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_S3:?}
      AWS_ENDPOINT: ${SERVICE_URL_OPENREPLAY}
      AWS_REGION: us-east-1
      BUCKET_NAME: mobs
      CH_USERNAME: default
      CH_PASSWORD: ''
      CLICKHOUSE_STRING: clickhouse-openreplay-clickhouse.db.svc.cluster.local:9000/default
      CLICKHOUSE_HTTP_STRING: clickhouse-openreplay-clickhouse.db.svc.cluster.local:8123/default
      pg_password: ${SERVICE_PASSWORD_POSTGRES:?}
      POSTGRES_STRING: postgres://postgres:${SERVICE_PASSWORD_POSTGRES:?}@postgresql.db.svc.cluster.local:5432/postgres?sslmode=disable
      ASSIST_URL: http://assist-openreplay.app.svc.cluster.local:9001/assist/%s
      ASSIST_KEY: ${SERVICE_PASSWORD_64_ASSISTKEY:?}
      REDIS_CACHE_ENABLED: 'false'
      REDIS_STRING: redis://redis-master.db.svc.cluster.local:6379

  images-openreplay:
    <<: *openreplay-service
    image: public.ecr.aws/p1t3u8a3/images:v1.28.0
    networks:
      default:
        aliases:
          - images-openreplay.app.svc.cluster.local
    environment:
      AWS_ACCESS_KEY_ID: ${SERVICE_USER_S3:?}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_S3:?}
      AWS_ENDPOINT: ${SERVICE_URL_OPENREPLAY}
      AWS_REGION: us-east-1
      BUCKET_NAME: mobs
      LICENSE_KEY: ''
      KAFKA_SERVERS: kafka.db.svc.cluster.local:9092
      KAFKA_USE_SSL: 'false'
      TOKEN_SECRET: ${SERVICE_PASSWORD_64_TOKEN:?}
      pg_password: ${SERVICE_PASSWORD_POSTGRES:?}
      POSTGRES_STRING: postgres://postgres:${SERVICE_PASSWORD_POSTGRES:?}@postgresql.db.svc.cluster.local:5432/postgres?sslmode=disable
      REDIS_STRING: redis://redis-master.db.svc.cluster.local:6379
      FS_CLEAN_HRS: '24'

  sink-openreplay:
